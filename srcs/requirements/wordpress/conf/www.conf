; PHP-FPM pool configuration for WordPress
; This file configures how PHP processes are managed

; Pool name - defines the pool as "www"
; You can have multiple pools with different names and settings
[www]

; Process manager type - controls how PHP processes are spawned
; ondemand = creates processes only when needed, kills them when idle (memory efficient)
; static = fixed number of processes always running
; dynamic = variable number between min/max limits
pm = ondemand

; Environment variables handling
; no = passes system environment variables to PHP scripts (needed for WP_DB, WP_USER, WP_PW)
; yes = would clear all environment variables (more secure but can break apps)
clear_env = no

; User and group that PHP processes run under
; www-data is the standard web server user in Debian/Ubuntu
; Ensures proper file permissions and security
user = www-data
group = www-data

; Maximum number of PHP processes this pool can create
; With pm = ondemand, it will create up to 10 processes if needed
; Each process handles one request at a time
; 10 is suitable for small to medium websites
pm.max_children = 10

; Network binding for PHP-FPM
; 0.0.0.0 = listens on all network interfaces (good for Docker containers)
; 9000 = port number where web server connects to send PHP requests
; Web server forwards PHP requests to this address
listen = 0.0.0.0:9000